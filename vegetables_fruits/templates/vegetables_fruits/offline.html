{% extends 'base.html' %}
{% load static %}

{% block title %}Hors connexion — Agriculture 2.0{% endblock %}

{% block content %}
<div class="row mt-5">
    <div class="col-md-8 mx-auto text-center">
        <div class="card p-5">
            <div style="font-size: 5rem; margin-bottom: 20px;">📡</div>
            <h2 style="color: #1b4332; font-weight: 700;">Vous êtes hors connexion</h2>
            <p class="text-muted mt-3">
                Pas de panique ! Vos données sont en sécurité.<br>
                Reconnectez-vous à Internet pour retrouver votre jardin.
            </p>
            <button onclick="window.location.reload()" class="btn btn-success mt-4" style="border-radius: 12px; padding: 10px 30px;">
                🔄 Réessayer
            </button>
        </div>
    </div>
</div>
{% endblock %}
