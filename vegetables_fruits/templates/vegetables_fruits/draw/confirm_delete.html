{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-danger text-white">
                    <h3 class="mb-0">🗑️ Confirmation de suppression</h3>
                </div>
                <div class="card-body">
                    <p class="lead">Êtes-vous sûr de vouloir supprimer cette figure ?</p>
                    
                    <div class="alert alert-warning">
                        <strong>{{ figure.name }}</strong><br>
                        Type: {{ figure.figure_type }}<br>
                        Créée le: {{ figure.created_at|date:"d/m/Y" }}
                    </div>
                    
                    <p class="text-danger">Cette action est irréversible !</p>
                    
                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-danger flex-grow-1">
                                🗑️ Confirmer la suppression
                            </button>
                            <a href="{% url 'vegetables_fruits:figure_detail' figure.id %}" class="btn btn-secondary flex-grow-1">
                                Annuler
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
