{% extends 'base.html' %}
{% load static %}

{% block title %}🗑️ Supprimer une photo{% endblock %}

{% block content %}
<div class="container py-4" style="max-width: 500px;">
    <div class="card">
        <div class="card-header bg-light">
            <h4 class="mb-0">🗑️ Confirmer la suppression</h4>
        </div>
        <div class="card-body text-center">
            <img src="{{ photo.image.url }}" alt="{{ photo.titre }}" style="max-width: 100%; height: 150px; object-fit: cover; border-radius: 8px;">
            <h5 class="mt-3">{{ photo.titre }}</h5>
            <p class="text-muted">Êtes-vous sûr de vouloir supprimer cette photo ?</p>
            <p class="text-danger small">Cette action est irréversible.</p>
            
            <form method="post">
                {% csrf_token %}
                <div class="d-flex gap-3 justify-content-center">
                    <button type="submit" class="btn btn-danger">
                        🗑️ Confirmer la suppression
                    </button>
                    <a href="{% url 'vegetables_fruits:galerie_photo_detail' photo.id %}" class="btn btn-secondary">
                        Annuler
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
