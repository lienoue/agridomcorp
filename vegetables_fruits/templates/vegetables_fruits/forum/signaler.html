{% extends 'base.html' %}
{% load static %}

{% block title %}Signaler un contenu{% endblock %}

{% block content %}
<div class="container py-4" style="max-width: 600px;">
    <div class="card">
        <div class="card-header bg-light">
            <h3 class="mb-0">⚠️ Signaler un contenu</h3>
        </div>
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                
                <div class="mb-3">
                    <label class="form-label fw-bold">Raison du signalement</label>
                    <textarea name="raison" class="form-control" rows="5" required 
                              placeholder="Expliquez pourquoi ce contenu vous semble inapproprié..."></textarea>
                </div>
                
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-warning">
                        📢 Envoyer le signalement
                    </button>
                    <a href="javascript:history.back()" class="btn btn-secondary">
                        Annuler
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
