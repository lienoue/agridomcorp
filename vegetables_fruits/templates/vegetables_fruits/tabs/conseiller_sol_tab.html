<div class="conseiller-sol-container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h5 class="mb-0">
            <i class="bi bi-geo-alt text-success"></i> Conseiller Sol
        </h5>
        <span class="badge bg-success rounded-pill">{{ conseils|length }} conseil(s)</span>
    </div>
    <br>

    {% if conseils %}
        <div class="row g-3">
            {% for item in conseils %}
                <div class="col-12">
                    <div class="card border-success">
                        <div class="card-body">
                            <div class="d-flex align-items-start">
                                <div style="font-size: 2rem; margin-right: 15px;">🌱</div>
                                <div>
                                    <h6 class="mb-1">{{ item.culture }}</h6>
                                    <p class="mb-0 text-muted">{{ item.conseil }}</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            {% endfor %}
        </div>
    {% else %}
        <div class="alert alert-info">
            <i class="bi bi-info-circle"></i> Aucune culture sur cette parcelle pour donner des conseils.
        </div>
    {% endif %}
</div>
