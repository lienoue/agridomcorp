[pytest]
DJANGO_SETTINGS_MODULE = vegetablesfruits.settings
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths = vegetables_fruits/tests
addopts =
    -v
    --strict-markers
    --tb=short
    --reuse-db
    --disable-warnings
    # --no-migrations
markers =
    slow: tests lents (à exclure en dev)
    integration: tests d'intégration (API + DB)
    unit: tests unitaires purs
    saison: tests du Chantier 27 (verifier_saison_culture)