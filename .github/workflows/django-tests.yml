name: Django CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Récupération du code
      uses: actions/checkout@v4

    - name: Installation de Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Installation des dépendances système (GDAL)
      run: |
        sudo apt-get update
        sudo apt-get install -y binutils libproj-dev gdal-bin libgdal-dev python3-gdal
        
        # ✅ Vérification que gdal-config est bien accessible
        which gdal-config
        gdal-config --version

    - name: Installation des dépendances Python
      run: |
        python -m pip install --upgrade pip
        
        # ✅ Installation de GDAL via un wheel Linux pré-compilé (beaucoup plus stable sur la CI)
        pip install --find-links=https://girder.github.io/large_image_wheels --no-cache GDAL
        
        # Installation du reste des dépendances (sans le .whl Windows)
        pip install -r requirements.txt
        pip install pytest pytest-django

    - name: Lancer les tests avec Pytest
      env:
        # Variables d'environnement factices pour que la CI ne plante pas
        DJANGO_SECRET_KEY: "ci-test-secret-key-not-for-prod"
        DJANGO_DEBUG: "True"
        MAPBOX_TOKEN: "fake-token"
        OPENWEATHER_API_KEY: "fake-key"
        SENDINBLUE_API_KEY: "fake-key"
        STRIPE_PUBLIC_KEY: "fake-key"
        STRIPE_SECRET_KEY: "fake-key"
        STRIPE_WEBHOOK_SECRET: "fake-key"
      run: |
        pytest -v