name: Django CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Récupération du code
      uses: actions/checkout@v4

    - name: Installation de Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Installation des dépendances système (GDAL)
      run: |
        sudo apt-get update
        sudo apt-get install -y binutils libproj-dev gdal-bin python3-gdal

    - name: Installation des dépendances Python
      run: |
        python -m pip install --upgrade pip
        # On installe GDAL en se basant sur la version système de Linux
        pip install GDAL==`gdal-config --version`
        # Ensuite on installe le reste des dépendances
        pip install -r requirements.txt
        pip install pytest pytest-django

    - name: Lancer les tests avec Pytest
      env:
        DJANGO_SECRET_KEY: "ci-test-secret-key-not-for-prod"
        DJANGO_DEBUG: "True"
        MAPBOX_TOKEN: "fake-token"
        OPENWEATHER_API_KEY: "fake-key"
      run: |
        pytest -v